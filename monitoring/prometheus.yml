# Prometheus Configuration
global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  # Scrape the Code Execution Engine
  - job_name: 'code-execution-engine'
    static_configs:
      - targets: ['code-engine:3000']
    metrics_path: /metrics
    scrape_interval: 5s

  # Scrape Prometheus itself
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']
