apiVersion: v1
kind: Service
metadata:
  name: code-execution-engine
  labels:
    app: code-execution-engine
spec:
  type: LoadBalancer
  ports:
  - port: 80
    targetPort: 3000
    protocol: TCP
    name: http
  selector:
    app: code-execution-engine
---
# ClusterIP Service for internal access
apiVersion: v1
kind: Service
metadata:
  name: code-execution-engine-internal
  labels:
    app: code-execution-engine
spec:
  type: ClusterIP
  ports:
  - port: 3000
    targetPort: 3000
    protocol: TCP
    name: http
  selector:
    app: code-execution-engine
