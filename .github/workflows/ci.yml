name: Code Execution Engine CI/CD

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  lint-and-build:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Check for syntax errors
        run: node --check src/server.js

      - name: Verify all source files
        run: |
          for file in src/**/*.js; do
            node --check "$file" && echo "✓ $file"
          done

  test-python:
    runs-on: ubuntu-latest
    needs: lint-and-build
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          cache: 'npm'

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: npm ci

      - name: Start server
        run: npm start &
        
      - name: Wait for server
        run: |
          for i in {1..10}; do
            curl -s http://localhost:3000/health && break
            echo "Waiting for server..."
            sleep 2
          done

      - name: Test Python execution
        run: |
          response=$(curl -s -X POST http://localhost:3000/api/execute \
            -H "Content-Type: application/json" \
            -d '{"language":"python","code":"print(2+2)"}')
          echo "$response"
          echo "$response" | grep -q '"stdout":"4'

      - name: Test JavaScript execution
        run: |
          response=$(curl -s -X POST http://localhost:3000/api/execute \
            -H "Content-Type: application/json" \
            -d '{"language":"javascript","code":"console.log(3*3)"}')
          echo "$response"
          echo "$response" | grep -q '"stdout":"9'

  test-java:
    runs-on: ubuntu-latest
    needs: lint-and-build
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          cache: 'npm'

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Install dependencies
        run: npm ci

      - name: Start server
        run: npm start &
        
      - name: Wait for server
        run: |
          for i in {1..10}; do
            curl -s http://localhost:3000/health && break
            sleep 2
          done

      - name: Test Java execution
        run: |
          response=$(curl -s -X POST http://localhost:3000/api/execute \
            -H "Content-Type: application/json" \
            -d '{"language":"java","code":"public class Main { public static void main(String[] args) { System.out.println(5+5); }}"}')
          echo "$response"
          echo "$response" | grep -q '"stdout":"10'

  docker-build:
    runs-on: ubuntu-latest
    needs: [test-python, test-java]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build production Docker image
        run: docker build -t code-execution-engine .

      - name: Verify Docker image
        run: docker images | grep code-execution-engine
