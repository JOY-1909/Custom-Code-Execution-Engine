name: Code Execution Engine CI/CD

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    runs-on: ubuntu-latest
    
    strategy:
      matrix:
        node-version: [18.x, 20.x]
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup GCC
        run: |
          sudo apt-get update
          sudo apt-get install -y g++
          g++ --version

      - name: Run linter (optional)
        run: npm run lint --if-present
        continue-on-error: true

      - name: Start server and run tests
        run: |
          npm start &
          sleep 3
          node tests/test-all.js
        env:
          CI: true

  docker-build:
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Python Docker image
        run: |
          docker build -t code-exec-python -f docker/Dockerfile.python docker/

      - name: Build Node.js Docker image
        run: |
          docker build -t code-exec-node -f docker/Dockerfile.node docker/

      - name: Build Java Docker image
        run: |
          docker build -t code-exec-java -f docker/Dockerfile.java docker/

      - name: Build C++ Docker image
        run: |
          docker build -t code-exec-cpp -f docker/Dockerfile.cpp docker/

      - name: Verify Docker images
        run: docker images | grep code-exec

  security-scan:
    runs-on: ubuntu-latest
    needs: test
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run npm audit
        run: npm audit --audit-level=high
        continue-on-error: true

      - name: Check for secrets
        uses: trufflesecurity/trufflehog@main
        with:
          path: ./
          base: ${{ github.event.repository.default_branch }}
          head: HEAD
        continue-on-error: true
